name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned deliberately. With a floating `stable`, a new Flutter
          # release could break CI with no code change — which is exactly what
          # happened: a newer Dart rejects a null-safety issue inside
          # pdfrx 1.3.5. This is also the version the release builds are made
          # with, so CI now matches what actually ships. Upgrading the
          # toolchain is a deliberate, separate change.
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      # Errors and warnings fail the build; lint infos do not. Most infos are
      # `withOpacity` deprecations from Flutter SDK churn, and gating on them
      # meant any SDK bump turned CI red without the code changing.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
